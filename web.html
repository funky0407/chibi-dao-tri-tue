<title>Bé Chibi Đảo Trí Tuệ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Bản đăng web: một màn hình game, màu cố định theo đồ hoạ của game (không đổi theo giao diện sáng/tối). */
  :root { --bg: #ffe5ec; --ink: #5b3a5e; color-scheme: light; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { width: 100%; height: 100%; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--ink);
    font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif; font-size: 28px; font-weight: 800; text-align: center;
    align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; line-height: 1.4;
  }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<div id="game"></div>
<div id="rotate" onclick="this.remove()">Bé hãy xoay ngang điện thoại để chơi nhé!<br>(chạm để bỏ qua)</div>
<script type="module" src="src/main.js"></script>
